name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Silence the Node 20 deprecation warning and pre-opt-in to the Node 24 runner
# (defaults change on 2026-06-02).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (skip native build scripts)
        # pnpm 11 errors on --frozen-lockfile if any package's build script
        # isn't pre-approved via lockfile metadata. We skip all scripts here
        # and rebuild only the allow-listed native deps in the next step.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild allow-listed native deps
        run: pnpm rebuild esbuild msgpackr-extract sharp

      - name: Verify peer-dep matrix against npm
        run: pnpm verify:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit + a11y tests (coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage

      - name: Build all packages
        run: pnpm build

      - name: Bundle budget per package
        run: node scripts/check-bundle-budget.mjs

  # SDK 55 / RN 0.83 downlevel verification. Library code declares
  # `react-native >=0.83.0` as a peer; this confirms the public API still
  # typechecks and tests pass when consumers stay on the older line.
  # Uses pnpm overrides at install time rather than the workspace's pins.
  downlevel:
    name: typecheck / test on RN 0.83 (SDK 55)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }

      - name: Install with RN/React downlevel overrides
        # --no-frozen-lockfile because the override edit above intentionally
        # diverges from the committed lockfile. --ignore-scripts + an explicit
        # rebuild avoids pnpm 11's ERR_PNPM_IGNORED_BUILDS (same dance the
        # quality job uses).
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.pnpm={...(p.pnpm||{}),overrides:{...(p.pnpm?.overrides||{}),'react':'19.1.0','react-native':'0.83.0','react-test-renderer':'19.1.0'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild msgpackr-extract sharp

      - name: Typecheck @mindees/ui only
        run: pnpm --filter @mindees/ui typecheck

      - name: Test @mindees/ui only
        run: pnpm --filter @mindees/ui test

  perf:
    name: perf regression (Reassure)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild msgpackr-extract sharp
      # `reassure measure` records render timings for the perf tests and writes
      # them to .reassure/current.perf. Baseline-vs-PR comparison (the two-pass
      # `reassure` flow against origin/main) is a follow-up; for now this gates
      # that the perf suite runs and the components stay renderable.
      - run: pnpm --filter @mindees/ui test:perf

  release:
    name: release (changesets)
    runs-on: ubuntu-latest
    needs: quality
    # Only run on main pushes when the repo owner has opted in to publishing.
    # Set `gh variable set PUBLISH_ENABLED --body true` once NPM_TOKEN (or
    # npm OIDC trusted publishing) is configured. Until then the job is
    # skipped so every push stays green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLISH_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild msgpackr-extract sharp
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
