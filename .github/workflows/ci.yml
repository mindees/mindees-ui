name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # The library publishes one set of artifacts but is validated against
        # both supported SDK lines. RN 0.83 = SDK 55, RN 0.85 = SDK 56.
        react-native: ['0.83.0', '0.85.3']
        react: ['19.1.0', '19.2.6']
        exclude:
          - react-native: '0.83.0'
            react: '19.2.6'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (override react / react-native for this matrix cell)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @mindees/ui add -D react@${{ matrix.react }} react-native@${{ matrix.react-native }}

      - name: Verify peer-dep matrix against npm
        run: pnpm verify:versions

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit + a11y tests (coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        if: matrix.react-native == '0.85.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage

      - name: Build all packages
        run: pnpm build

      - name: Bundle budget per package
        if: matrix.react-native == '0.85.3'
        run: node scripts/check-bundle-budget.mjs

  perf:
    name: perf regression (Reassure)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mindees/ui test:perf -- --baseline origin/main

  release:
    name: release (changesets)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
