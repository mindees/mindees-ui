packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 11 stopped reading the `pnpm` field from root package.json; the
# `pnpm-workspace.yaml` is the only home for these settings now.
# https://pnpm.io/settings
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp
  - '@swc/core'

# Some Expo SDK 56 sub-deps pin @types/react ^19.0.0; React Native 0.85 and
# @types/react-dom 19.2.x want ^19.2.0. Force a single copy so the workspace
# doesn't see two React type definitions (manifests as TS2786 "cannot be
# used as a JSX component" when consuming @mindees/ui from apps/example).
overrides:
  '@types/react': '~19.2.15'

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.60.0'
  - '@typescript-eslint/parser@8.60.0'
  - '@typescript-eslint/project-service@8.60.0'
  - '@typescript-eslint/scope-manager@8.60.0'
  - '@typescript-eslint/tsconfig-utils@8.60.0'
  - '@typescript-eslint/type-utils@8.60.0'
  - '@typescript-eslint/types@8.60.0'
  - '@typescript-eslint/typescript-estree@8.60.0'
  - '@typescript-eslint/utils@8.60.0'
  - '@typescript-eslint/visitor-keys@8.60.0'
  - typescript-eslint@8.60.0
